<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Registration — {{ school_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body { background: linear-gradient(135deg,#1e1b4b,#312e81); min-height:100vh; display:flex; align-items:center; justify-content:center; }</style>
</head>
<body>
  <div class="card p-4" style="max-width:440px;width:100%;border:none;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.3);">
    <div class="text-center mb-4">
      <div style="font-size:2.5rem;">🏫</div>
      <h4 class="fw-bold mb-0">Parent Registration</h4>
      <p class="text-muted small">{{ school_name }}</p>
    </div>
    {% if success %}
    <div class="alert alert-success">
      Account created! <a href="/login">Login here</a>.
    </div>
    {% else %}
      {% if error %}<div class="alert alert-danger small">{{ error }}</div>{% endif %}
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Student ID</label>
          <input name="student_id" class="form-control" required placeholder="e.g. STU001">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Parent Email (on record)</label>
          <input type="email" name="parent_email" class="form-control" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Choose Password</label>
          <input type="password" name="password" class="form-control" minlength="6" required>
        </div>
        <button type="submit" class="btn w-100 text-white fw-semibold" style="background:#4f46e5;">Create Account</button>
      </form>
    {% endif %}
    <p class="text-center text-muted small mt-3 mb-0"><a href="/login">Back to Login</a></p>
  </div>
</body>
</html>
