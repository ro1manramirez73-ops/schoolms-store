<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password — {{ school_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body { background:#f0f2f5; min-height:100vh; display:flex; align-items:center; justify-content:center; }</style>
</head>
<body>
  <div class="card p-4" style="max-width:400px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.1);border:none;border-radius:12px;">
    <h4 class="fw-bold mb-1">Set New Password</h4>
    <p class="text-muted small mb-4">Please choose a password (at least 6 characters).</p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold small">New Password</label>
        <input type="password" name="new_password" class="form-control" minlength="6" required autofocus>
      </div>
      <button type="submit" class="btn w-100 text-white" style="background:#4f46e5;">Save Password</button>
    </form>
  </div>
</body>
</html>
