<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — {{ school_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { margin: 0; min-height: 100vh; display: flex; background: #f1f5f9; }

    .left-panel {
      width: 42%;
      background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 60%, #312e81 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 3rem; position: relative; overflow: hidden;
    }
    .left-panel::before {
      content: '';
      position: absolute; top: -80px; right: -80px;
      width: 320px; height: 320px; border-radius: 50%;
      background: rgba(99,102,241,.15);
    }
    .left-panel::after {
      content: '';
      position: absolute; bottom: -60px; left: -60px;
      width: 240px; height: 240px; border-radius: 50%;
      background: rgba(99,102,241,.1);
    }

    .left-panel h1 { color: #fff; font-size: 1.75rem; font-weight: 700; text-align: center; margin-bottom: .5rem; }
    .left-panel p  { color: #94a3b8; text-align: center; font-size: .9rem; }

    .left-panel .feature {
      display: flex; align-items: center; gap: .75rem;
      color: #c7d2fe; font-size: .82rem; margin-top: .75rem;
    }
    .left-panel .feature i { font-size: 1rem; color: #818cf8; flex-shrink: 0; }

    .right-panel {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .login-box {
      background: #fff; border-radius: 16px; padding: 2.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.08); width: 100%; max-width: 400px;
    }
    .login-box h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: .25rem; color: #0f172a; }
    .login-box p  { font-size: .83rem; color: #64748b; margin-bottom: 1.75rem; }

    .form-label { font-size: .78rem; font-weight: 600; color: #374151; margin-bottom: .3rem; }
    .form-control {
      border-radius: 9px; border-color: #e2e8f0; padding: .55rem .85rem;
      font-size: .875rem; transition: .15s;
    }
    .form-control:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .btn-signin {
      background: linear-gradient(90deg,#4f46e5,#6366f1);
      color: #fff; border: none; border-radius: 9px; width: 100%;
      padding: .65rem; font-weight: 600; font-size: .9rem;
      transition: .2s; letter-spacing: .01em;
    }
    .btn-signin:hover { background: linear-gradient(90deg,#3730a3,#4f46e5); color: #fff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,.35); }

    .divider { border: none; border-top: 1px solid #e2e8f0; margin: 1.25rem 0; }
    .parent-link { text-align: center; font-size: .8rem; color: #64748b; }
    .parent-link a { color: #4f46e5; font-weight: 600; text-decoration: none; }
    .parent-link a:hover { text-decoration: underline; }

    @media(max-width:768px) { .left-panel { display: none; } }
  </style>
</head>
<body>
  <div class="left-panel">
    <h1>{{ school_name }}</h1>
    <p>{{ school_address }}</p>
    <div style="margin-top:2rem; width:100%; max-width:260px;">
      <div class="feature"><i class="bi bi-shield-check"></i> Secure role-based access</div>
      <div class="feature"><i class="bi bi-people"></i> Students, Parents &amp; Staff</div>
      <div class="feature"><i class="bi bi-graph-up"></i> Real-time grades &amp; attendance</div>
      <div class="feature"><i class="bi bi-cash-stack"></i> Fee &amp; payment tracking</div>
    </div>
  </div>

  <div class="right-panel">
    <div class="login-box">
      <h2>Welcome back</h2>
      <p>Sign in to your account to continue</p>

      {% if error %}
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-3" style="border-radius:9px;font-size:.82rem;">
        <i class="bi bi-exclamation-circle-fill"></i> {{ error }}
      </div>
      {% endif %}

      <form method="POST" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text" style="border-radius:9px 0 0 9px;border-color:#e2e8f0;background:#f8fafc;">
              <i class="bi bi-person" style="color:#94a3b8;"></i>
            </span>
            <input name="username" id="usernameField" class="form-control" style="border-radius:0 9px 9px 0;" autofocus required placeholder="Enter username" autocomplete="off">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text" style="border-radius:9px 0 0 9px;border-color:#e2e8f0;background:#f8fafc;">
              <i class="bi bi-lock" style="color:#94a3b8;"></i>
            </span>
            <input type="password" name="password" id="pwField" class="form-control" style="border-radius:0 9px 9px 0;" required placeholder="Enter password" autocomplete="new-password">
            <button type="button" class="btn btn-outline-secondary" style="border-radius:0 9px 9px 0;border-color:#e2e8f0;" onclick="togglePw()">
              <i class="bi bi-eye" id="pwIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-signin">Sign In &rarr;</button>
      </form>

      <hr class="divider">
      <div class="parent-link">
        Are you a parent? <a href="/parent/register">Register your account here</a>
      </div>
      <div class="mt-3 text-center">
        <a href="/" class="btn btn-outline-secondary w-100" style="border-radius:9px;font-size:.875rem;font-weight:600;">
          <i class="bi bi-house"></i> Go to Home
        </a>
      </div>
    </div>
  </div>

  <script>
    function togglePw() {
      const f = document.getElementById('pwField');
      const i = document.getElementById('pwIcon');
      if (f.type === 'password') { f.type = 'text'; i.className = 'bi bi-eye-slash'; }
      else { f.type = 'password'; i.className = 'bi bi-eye'; }
    }
    // Browsers (Chrome/Edge) inject autofill AFTER load, so clear with a short delay
    function clearFields() {
      document.getElementById('usernameField').value = '';
      document.getElementById('pwField').value = '';
    }
    window.addEventListener('load', function () {
      clearFields();
      setTimeout(clearFields, 50);
      setTimeout(clearFields, 200);
    });
  </script>
</body>
</html>
